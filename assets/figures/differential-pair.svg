<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="1200" height="620" fill="#fff"/><text x="60" y="70" font-family="Arial" font-size="34" font-weight="700" fill="#111827">MOS Differential Pair — Current Steering</text><text x="60" y="110" font-family="Arial" font-size="20" fill="#4b5563">A differential input voltage redistributes a nearly constant tail current.</text><line x1="360" y1="155" x2="360" y2="325" stroke="#111827" stroke-width="4"/><line x1="760" y1="155" x2="760" y2="325" stroke="#111827" stroke-width="4"/><line x1="360" y1="155" x2="760" y2="155" stroke="#111827" stroke-width="4"/><text x="545" y="140" font-family="Arial" font-size="22">VDD</text><line x1="330" y1="345" x2="330" y2="455" stroke="#111827" stroke-width="5"/><line x1="370" y1="365" x2="370" y2="435" stroke="#111827" stroke-width="5"/><line x1="290" y1="400" x2="330" y2="400" stroke="#2563eb" stroke-width="4"/><line x1="730" y1="345" x2="730" y2="455" stroke="#111827" stroke-width="5"/><line x1="770" y1="365" x2="770" y2="435" stroke="#111827" stroke-width="5"/><line x1="690" y1="400" x2="730" y2="400" stroke="#2563eb" stroke-width="4"/><line x1="360" y1="325" x2="360" y2="365" stroke="#111827" stroke-width="4"/><line x1="760" y1="325" x2="760" y2="365" stroke="#111827" stroke-width="4"/><line x1="360" y1="435" x2="360" y2="480" stroke="#111827" stroke-width="4"/><line x1="760" y1="435" x2="760" y2="480" stroke="#111827" stroke-width="4"/><line x1="360" y1="480" x2="760" y2="480" stroke="#111827" stroke-width="4"/><line x1="560" y1="480" x2="560" y2="525" stroke="#111827" stroke-width="4"/><circle cx="560" cy="555" r="28" fill="none" stroke="#111827" stroke-width="4"/><text x="605" y="562" font-family="Arial" font-size="22">ITAIL</text><text x="270" y="340" font-family="Arial" font-size="24" font-weight="700">M1</text><text x="670" y="340" font-family="Arial" font-size="24" font-weight="700">M2</text><text x="165" y="408" font-family="Arial" font-size="22" fill="#2563eb">VIN+</text><text x="805" y="408" font-family="Arial" font-size="22" fill="#2563eb">VIN−</text><text x="235" y="325" font-family="Arial" font-size="22" fill="#047857">VOUT−</text><text x="800" y="325" font-family="Arial" font-size="22" fill="#047857">VOUT+</text><rect x="890" y="210" width="250" height="250" rx="18" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/><text x="920" y="250" font-family="Arial" font-size="23" font-weight="700">Intuition</text><text x="920" y="295" font-family="Arial" font-size="20">VIN+ ↑ → ID1 ↑</text><text x="920" y="335" font-family="Arial" font-size="20">VIN− ↓ → ID2 ↓</text><text x="920" y="395" font-family="Arial" font-size="20" fill="#4b5563">The tail current is steered</text><text x="920" y="425" font-family="Arial" font-size="20" fill="#4b5563">between the two branches.</text></svg>