<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="650" viewBox="0 0 1300 650"><rect width="1300" height="650" fill="#fff"/><text x="60" y="70" font-family="Arial" font-size="34" font-weight="700" fill="#111827">Bode Intuition — Poles, Zeros, and Unity-Gain Crossing</text><text x="60" y="110" font-family="Arial" font-size="20" fill="#4b5563">Each pole adds magnitude roll-off and phase lag; zeros can reshape both.</text><line x1="120" y1="520" x2="1180" y2="520" stroke="#111827" stroke-width="3"/><line x1="120" y1="520" x2="120" y2="160" stroke="#111827" stroke-width="3"/><text x="1120" y="560" font-family="Arial" font-size="22">log f</text><text x="78" y="398" font-family="Arial" font-size="18" fill="#6b7280">0 dB</text><line x1="120" y1="390" x2="1180" y2="390" stroke="#9ca3af" stroke-width="2" stroke-dasharray="10 10"/><path d="M150 225 L430 225 L680 390 L900 500" fill="none" stroke="#2563eb" stroke-width="5"/><circle cx="430" cy="225" r="8" fill="#dc2626"/><circle cx="680" cy="390" r="8" fill="#059669"/><circle cx="900" cy="500" r="8" fill="#7c3aed"/><line x1="430" y1="225" x2="430" y2="520" stroke="#dc2626" stroke-width="2" stroke-dasharray="8 8"/><line x1="680" y1="390" x2="680" y2="520" stroke="#059669" stroke-width="2" stroke-dasharray="8 8"/><line x1="900" y1="500" x2="900" y2="520" stroke="#7c3aed" stroke-width="2" stroke-dasharray="8 8"/><text x="365" y="205" font-family="Arial" font-size="21" fill="#dc2626">dominant pole p1</text><text x="625" y="370" font-family="Arial" font-size="21" fill="#047857">fu</text><text x="840" y="480" font-family="Arial" font-size="21" fill="#6d28d9">higher pole p2</text><text x="485" y="285" font-family="Arial" font-size="20" fill="#2563eb">−20 dB/dec</text><text x="740" y="455" font-family="Arial" font-size="20" fill="#2563eb">steeper roll-off</text><rect x="845" y="150" width="320" height="150" rx="16" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/><text x="875" y="190" font-family="Arial" font-size="22" font-weight="700">Design target</text><text x="875" y="228" font-family="Arial" font-size="20">Cross unity gain before</text><text x="875" y="258" font-family="Arial" font-size="20">higher-order phase lag</text><text x="875" y="288" font-family="Arial" font-size="20">becomes too large.</text></svg>