<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="540" viewBox="0 0 1300 540"><rect width="1300" height="540" fill="#fff"/><text x="60" y="70" font-family="Arial" font-size="34" font-weight="700" fill="#111827">Two-Stage Op-Amp — Architectural View</text><text x="60" y="110" font-family="Arial" font-size="20" fill="#4b5563">Separate gain stages improve DC gain; compensation controls the multi-pole loop.</text><rect x="120" y="190" width="280" height="180" rx="22" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="190" y="245" font-family="Arial" font-size="27" font-weight="700" fill="#1d4ed8">Stage 1</text><text x="155" y="290" font-family="Arial" font-size="23">Differential input</text><text x="165" y="325" font-family="Arial" font-size="23">+ active load</text><rect x="520" y="190" width="280" height="180" rx="22" fill="#ecfdf5" stroke="#059669" stroke-width="3"/><text x="590" y="245" font-family="Arial" font-size="27" font-weight="700" fill="#047857">Stage 2</text><text x="565" y="290" font-family="Arial" font-size="23">Common-source</text><text x="585" y="325" font-family="Arial" font-size="23">gain stage</text><rect x="930" y="190" width="220" height="180" rx="22" fill="#f9fafb" stroke="#6b7280" stroke-width="3"/><text x="995" y="245" font-family="Arial" font-size="27" font-weight="700">Load</text><text x="975" y="300" font-family="Arial" font-size="23">CL / RL</text><line x1="65" y1="280" x2="120" y2="280" stroke="#111827" stroke-width="4"/><polygon points="120,280 102,270 102,290" fill="#111827"/><text x="65" y="255" font-family="Arial" font-size="20">VIN±</text><line x1="400" y1="280" x2="520" y2="280" stroke="#111827" stroke-width="4"/><polygon points="520,280 502,270 502,290" fill="#111827"/><text x="435" y="255" font-family="Arial" font-size="20">V1</text><line x1="800" y1="280" x2="930" y2="280" stroke="#111827" stroke-width="4"/><polygon points="930,280 912,270 912,290" fill="#111827"/><text x="842" y="255" font-family="Arial" font-size="20">VOUT</text><path d="M660 190 C660 125 400 125 400 190" fill="none" stroke="#dc2626" stroke-width="4"/><line x1="515" y1="105" x2="515" y2="147" stroke="#dc2626" stroke-width="4"/><line x1="545" y1="105" x2="545" y2="147" stroke="#dc2626" stroke-width="4"/><text x="565" y="135" font-family="Arial" font-size="22" fill="#dc2626">CC</text><rect x="190" y="420" width="910" height="70" rx="14" fill="#f3f4f6"/><text x="220" y="462" font-family="Arial" font-size="23">A0 ≈ A1 × A2   •   Larger CC → usually better stability, lower GBW / slew rate</text></svg>