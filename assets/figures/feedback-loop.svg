<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="560" viewBox="0 0 1250 560"><rect width="1250" height="560" fill="#fff"/><text x="60" y="70" font-family="Arial" font-size="34" font-weight="700" fill="#111827">Negative Feedback — Loop Gain View</text><text x="60" y="110" font-family="Arial" font-size="20" fill="#4b5563">Stability is determined by the magnitude and phase accumulated around the loop.</text><circle cx="260" cy="285" r="52" fill="#fff" stroke="#111827" stroke-width="4"/><text x="246" y="275" font-family="Arial" font-size="28">+</text><text x="247" y="320" font-family="Arial" font-size="28">−</text><line x1="80" y1="270" x2="208" y2="270" stroke="#111827" stroke-width="4"/><polygon points="208,270 190,260 190,280" fill="#111827"/><text x="90" y="245" font-family="Arial" font-size="22">VIN</text><rect x="420" y="210" width="260" height="150" rx="20" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="515" y="270" font-family="Arial" font-size="31" font-weight="700" fill="#1d4ed8">A(s)</text><text x="462" y="315" font-family="Arial" font-size="21">forward amplifier</text><line x1="312" y1="285" x2="420" y2="285" stroke="#111827" stroke-width="4"/><polygon points="420,285 402,275 402,295" fill="#111827"/><line x1="680" y1="285" x2="1010" y2="285" stroke="#111827" stroke-width="4"/><polygon points="1010,285 992,275 992,295" fill="#111827"/><text x="1025" y="293" font-family="Arial" font-size="22">VOUT</text><rect x="580" y="405" width="230" height="95" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="3"/><text x="655" y="462" font-family="Arial" font-size="30" font-weight="700" fill="#047857">β(s)</text><path d="M930 285 L930 452 L810 452" fill="none" stroke="#111827" stroke-width="4"/><polygon points="810,452 828,442 828,462" fill="#111827"/><path d="M580 452 L260 452 L260 337" fill="none" stroke="#111827" stroke-width="4"/><polygon points="260,337 250,355 270,355" fill="#111827"/><rect x="850" y="390" width="330" height="125" rx="16" fill="#f9fafb" stroke="#d1d5db" stroke-width="2"/><text x="880" y="425" font-family="Arial" font-size="22" font-weight="700">Loop gain</text><text x="880" y="462" font-family="Arial" font-size="26" fill="#2563eb">T(s) = A(s)β(s)</text><text x="880" y="495" font-family="Arial" font-size="19" fill="#4b5563">Check |T| = 1 and loop phase.</text></svg>